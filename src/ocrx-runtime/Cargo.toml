[package]
name = "ocrx-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
metal = ["llama-cpp-sys-2/metal"]
# W1.1: GPU backends are opt-in build features. Both must keep mtmd (B1):
# features are additive on the shared dependency, so enabling vulkan/cuda
# never drops the mtmd feature WP.2 pinned for Windows.
vulkan = ["llama-cpp-sys-2/vulkan"]
cuda = ["llama-cpp-sys-2/cuda"]

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.152", default-features = false, features = ["mtmd"] }
llama-cpp-sys-2 = { version = "=0.1.153", default-features = false, features = ["mtmd"] }

# WP.2 freeze: Windows shares the same pinned wrapper/sys binding as macOS
# (mtmd required; a Windows build without mtmd cannot compile LlamaMtmdRuntime).
[target.'cfg(target_os = "windows")'.dependencies]
llama-cpp-2 = { version = "=0.1.152", default-features = false, features = ["mtmd"] }
llama-cpp-sys-2 = { version = "=0.1.153", default-features = false, features = ["mtmd"] }
