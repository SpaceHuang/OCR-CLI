[package]
name = "ocrx"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ocrx-core = { path = "../ocrx-core" }
ocrx-inference = { path = "../ocrx-inference" }
ocrx-inference-api = { path = "../ocrx-inference-api" }
ocrx-scan = { path = "../ocrx-scan" }
ocrx-output = { path = "../ocrx-output" }
ocrx-skill = { path = "../ocrx-skill" }
ctrlc = "3.5.2"
vulkano = { version = "=0.35.2", optional = true }

[features]
default = []
vulkan = ["ocrx-inference/vulkan", "dep:vulkano"]
cuda = ["ocrx-inference/cuda"]

[dev-dependencies]
serde_json = { workspace = true }
